<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Road Rash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;touch-action:none;-webkit-tap-highlight-color:transparent}
#c{display:block;width:100vw;height:100vh}
#pcanvas{position:fixed;bottom:0;left:50%;transform:translateX(-50%);pointer-events:none;z-index:10}
#hud{position:fixed;top:0;left:0;right:0;z-index:20;padding:7px 10px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
.hcol{display:flex;flex-direction:column;gap:3px}
.hrow{display:flex;gap:5px;align-items:center}
.hlbl{color:#ccc;font-size:9px;letter-spacing:1px;text-shadow:1px 1px 0 #000}
.barbg{background:#0a0a0a;border:1.5px solid #333;border-radius:2px;overflow:hidden}
.bar{height:11px;transition:width .08s linear}
#hpb{background:linear-gradient(90deg,#c00,#f80,#ff0);width:100%}
#ntb{background:linear-gradient(90deg,#005,#06f,#0cf);width:100%}
#spd{color:#ff0;font-size:21px;font-weight:bold;text-shadow:2px 2px 0 #000,0 0 10px rgba(255,220,0,.4);text-align:center}
#pos{color:#fff;font-size:12px;text-shadow:1px 1px 0 #000;text-align:center}
#lap{color:#0cf;font-size:12px;text-shadow:1px 1px 0 #000;text-align:center}
#zon{color:#8f8;font-size:10px;letter-spacing:2px;text-shadow:1px 1px 0 #000;text-align:center;margin-top:2px}
#cmsg{position:fixed;top:36%;left:50%;transform:translateX(-50%);color:#ff0;font-size:28px;font-weight:bold;text-shadow:3px 3px 0 #900;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none;white-space:nowrap}
#thint{position:fixed;bottom:80px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none;z-index:15;opacity:0;transition:opacity 1s}
#thint.show{opacity:.4}
.th{border:1.5px solid rgba(255,255,255,.7);border-radius:10px;color:#fff;font-size:12px;padding:7px 18px;text-align:center;line-height:1.5}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100}
#overlay h1{font-size:clamp(44px,10vw,80px);color:#f80;text-shadow:4px 4px 0 #c00,8px 8px 0 #500;letter-spacing:5px;margin-bottom:12px}
#overlay p{color:#aaa;font-size:14px;text-align:center;max-width:340px;line-height:2;margin-bottom:28px;padding:0 20px}
#overlay p strong{color:#ffe}
.bigbtn{background:linear-gradient(180deg,#f90,#b40);border:3px solid #fd0;color:#fff;font-size:21px;font-weight:bold;padding:13px 46px;border-radius:7px;cursor:pointer;letter-spacing:2px;font-family:'Courier New',monospace;text-shadow:1px 1px 0 #000}
.bigbtn:active{transform:scale(.96)}
#finover{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:200}
#finover h2{font-size:clamp(30px,7vw,56px);color:#ff0;text-shadow:3px 3px 0 #c00;margin-bottom:18px}
#fstats{font-size:17px;color:#bbb;line-height:2.5;text-align:center;margin-bottom:28px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<canvas id="pcanvas" width="220" height="200"></canvas>

<div id="hud">
  <div class="hcol">
    <div class="hlbl">HEALTH</div>
    <div class="barbg" style="width:116px"><div class="bar" id="hpb"></div></div>
    <div class="hlbl">NITRO</div>
    <div class="barbg" style="width:116px"><div class="bar" id="ntb"></div></div>
  </div>
  <div class="hcol" style="align-items:center">
    <div id="spd">0 mph</div>
    <div id="pos">POS 1/6</div>
    <div id="lap">LAP 1/3</div>
    <div id="zon">CITY</div>
  </div>
  <div class="hcol"></div>
</div>

<div id="cmsg"></div>

<div id="thint">
  <div class="th">◀ STEER<br>tap·punch<br>dbl·kick</div>
  <div class="th">STEER ▶<br>tap·punch<br>dbl·kick</div>
</div>

<div id="overlay">
  <h1>ROAD RASH</h1>
  <p>
    <strong>Left half</strong> of screen → steer left<br>
    <strong>Right half</strong> → steer right<br>
    Both hands = straight · nitro boost<br>
    <strong>Tap</strong> = punch &nbsp;·&nbsp; <strong>Double tap</strong> = kick<br>
    3 laps · knock rivals off their bikes!
  </p>
  <button class="bigbtn" onclick="startGame()">START RACE</button>
</div>

<div id="finover">
  <h2 id="ftitle">RACE OVER</h2>
  <div id="fstats"></div>
  <button class="bigbtn" onclick="startGame()">RACE AGAIN</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>

const ZONE_SKY=[0x334466,0x5588cc,0x3366aa,0x223355],ZONE_FOG_NEAR=[70,110,90,75],ZONE_FOG_FAR=[190,300,240,200];

(function buildRoad(){

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false,powerPreference:'high-performance'});

const NV=SEGS_VIS*2;

function doKick(dir){if(!gameRunning||P.cpK>0||P.crashed)return;P.cpK=1.4;let h=false;for(const n of npcs){if(Math.abs(n.dist-P.dist)<12&&Math.abs(n.latOff-P.latOff)<10.5){if(n.hit(48,true,dir))h=true;}}showMsg(h?'KICK! -48':'MISS!',h?'#d0f':'#777');}
const camTgt={px:0,py:5,pz:0,lx:0,ly:1.5,lz:6};
function updateCamera(dt){const p=segPos(P.dist),s=segs[p.idx];const lx=s.rx*P.latOff,lz=s.rz*P.latOff;const tpx=p.x-s.dx*9+lx,tpy=p.y+4.6,tpz=p.z-s.dz*9+lz;const ai=(p.idx+24)%SEGS_TOT,sa=segs[ai];const tlx=sa.x+lx,tly=sa.y+1.6,tlz=sa.z+lz;const lf=1-Math.pow(1-.14,dt*60);camTgt.px+=(tpx-camTgt.px)*lf;camTgt.py+=(tpy-camTgt.py)*lf;camTgt.pz+=(tpz-camTgt.pz)*lf;camTgt.lx+=(tlx-camTgt.lx)*lf;camTgt.ly+=(tly-camTgt.ly)*lf;camTgt.lz+=(tlz-camTgt.lz)*lf;camera.position.set(camTgt.px,camTgt.py,camTgt.pz);camera.lookAt(camTgt.lx,camTgt.ly,camTgt.lz);}
const hudHP=document.getElementById('hpb'),hudNT=document.getElementById('ntb'),hudSpd=document.getElementById('spd'),hudPos=document.getElementById('pos'),hudLap=document.getElementById('lap'),hudZon=document.getElementById('zon');
function updateHUD(){hudHP.style.width=Math.max(0,P.hp)+'%';hudNT.style.width=P.nitro+'%';hudSpd.textContent=Math.round(P.speed*2.24)+' mph';let pos=1;for(const n of npcs)if(!n.finished&&n.dist>P.dist)pos++;hudPos.textContent=`POS ${pos}/${NUM_NPCS+1}`;hudLap.textContent=`LAP ${Math.min(P.lap,LAPS)}/${LAPS}`;const si=getSegIdx(P.dist);hudZon.textContent=ZONE_NAMES[segs[si].zone];}
function startGame(){document.getElementById('overlay').style.display='none';document.getElementById('finover').style.display='none';resetP();for(const n of npcs)n.dispose();npcs=[];for(let i=0;i<NUM_NPCS;i++)npcs.push(new NPC(i,-30-i*20,NPC_COLS[i],NPC_NAMES[i]));const p=segPos(0),s=segs[0];camTgt.px=p.x-s.dx*9;camTgt.py=p.y+4.6;camTgt.pz=p.z-s.dz*9;camTgt.lx=segs[24].x;camTgt.ly=segs[24].y+1.6;camTgt.lz=segs[24].z;gameTime=0;gameRunning=true;}
function showFinish(){const fo=document.getElementById('finover');fo.style.display='flex';let pos=1;for(const n of npcs)if(n.dist>P.dist||n.finished)pos++;const m=Math.floor(gameTime/60);const sc=(gameTime%60).toFixed(1).padStart(4,'0');document.getElementById('ftitle').textContent=pos===1?'YOU WIN!':'RACE OVER';document.getElementById('fstats').innerHTML=`POSITION: ${pos} / ${NUM_NPCS+1}<br>TIME: ${m}:${sc}<br>HP: ${Math.round(P.hp)}%`;}
let smoothDt=.016;
function update(dt){
  if(!gameRunning)return;gameTime+=dt;
  P.cpP=Math.max(0,P.cpP-dt);P.cpK=Math.max(0,P.cpK-dt);P.nccool=Math.max(0,P.nccool-dt);
  if(P.crashed){P.crashTimer-=dt;if(P.crashTimer<=0){P.crashed=false;P.speed=9;}for(const n of npcs)n.update(dt,P.dist);updateRoad(P.dist);updateEnv(P.dist);updateSky(P.dist,dt);updateRain(dt);updateCamera(dt);drawPlayerBike(0,true,P.hp);updateHUD();return;}
  const bothDown=TC.steerL&&TC.steerR,usingNitro=bothDown&&P.nitro>0;
  const tspd=usingNitro?P.maxSpeed*1.24:P.maxSpeed,accRate=usingNitro?18:13;
  P.speed+=(tspd-P.speed)*Math.min(1,accRate*dt);P.speed=Math.max(5,P.speed);
  P.nitro=usingNitro?Math.max(0,P.nitro-dt*22):Math.min(100,P.nitro+dt*9);
  const sl=TC.steerL&&!TC.steerR,sr=TC.steerR&&!TC.steerL,steerRate=12*(P.speed/P.maxSpeed+.32);
  if(sl)P.latOff-=steerRate*dt;if(sr)P.latOff+=steerRate*dt;
  P.latOff=Math.max(-ROAD_W*.44,Math.min(ROAD_W*.44,P.latOff));
  const lTgt=sl?-1:sr?1:0;P.lean+=(lTgt*.9-P.lean)*dt*6;
  P.dist+=P.speed*dt;
  if(P.dist>TOTAL_DIST*P.lap){P.lap++;if(P.lap>LAPS){P.finished=true;gameRunning=false;showFinish();return;}showMsg(`LAP ${P.lap}!`,'#0cf');}
  if(Math.abs(P.latOff)>ROAD_W*.46){P.hp-=dt*18;if(P.hp<=0)triggerCrash('WIPEOUT!');}
  if(P.nccool===0){
    const now=new Set();
    for(const n of npcs){if(n.crashed||n.flyOff||n.finished)continue;const inR=Math.abs(n.dist-P.dist)<6.5&&Math.abs(n.latOff-P.latOff)<3.8;if(inR){now.add(n.i);if(!P.prevClose.has(n.i)){P.hp-=19;P.speed*=.78;P.latOff+=(P.latOff<n.latOff?-2.2:2.2);P.nccool=1.6;if(P.hp<=0){triggerCrash('CRASHED!');break;}showMsg('COLLISION!','#f60');}}}
    P.prevClose=now;
  }else{P.prevClose=new Set();}
  for(const n of npcs)n.update(dt,P.dist);
  updateRoad(P.dist);updateEnv(P.dist);updateSky(P.dist,dt);updateRain(dt);updateCamera(dt);drawPlayerBike(P.lean,false,P.hp);updateHUD();
}
function resize(){const W=innerWidth,H=innerHeight;renderer.setSize(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
let lastT=0;
function loop(t){requestAnimationFrame(loop);const raw=Math.min((t-lastT)/1000,.05);lastT=t;smoothDt=smoothDt*.9+raw*.1;update(smoothDt);renderer.render(scene,camera);}
updateRoad(0);updateEnv(0);
const _p0=segPos(0),_s0=segs[0];camera.position.set(_p0.x-_s0.dx*9,_p0.y+4.6,_p0.z-_s0.dz*9);camera.lookAt(segs[24].x,segs[24].y+1.5,segs[24].z);renderer.render(scene,camera);
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
</script>
