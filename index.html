<script src="https://cdn.jsdelivr.net/npm/three@0.134.0/build/three.min.js"></script>
<script>
'use strict';

// ── Road constants ─────────────────────────────────────────────────────────
const SEG_LEN    = 6;
const ROAD_W     = 16;
const SEGS_TOT   = 1200;
const SEGS_VIS   = 110;
const TOTAL_DIST = SEG_LEN * SEGS_TOT;
const LAPS       = 3;
const NUM_NPCS   = 5;
const NPC_COLORS = ['#e53','#2d9','#fd0','#c4f','#4cf'];
const NPC_NAMES  = ['Viper','Snake','Hawk','Wolf','Blade'];

// ── Build road segments ────────────────────────────────────────────────────
const segs = new Array(SEGS_TOT);
(function buildRoad() {
  let x=0,y=0,z=0, ay=0, ax=0;
  for(let i=0;i<SEGS_TOT;i++){
    const t=i/SEGS_TOT;
    const curveY = Math.sin(t*Math.PI*7)*0.02 + Math.sin(t*Math.PI*15)*0.007;
    const pitch  = Math.sin(t*Math.PI*5)*0.005 + Math.sin(t*Math.PI*11)*0.003;
    ay += curveY;
    ax += pitch;
    const cdx=Math.cos(ax), cdy=Math.sin(ax);
    segs[i]={
      x,y,z,
      dx: Math.sin(ay)*cdx,
      dy: cdy,
      dz: Math.cos(ay)*cdx,
      ay, curve: curveY
    };
    x+=segs[i].dx*SEG_LEN;
    y+=segs[i].dy*SEG_LEN;
    z+=segs[i].dz*SEG_LEN;
  }
})();

function getSegIdx(dist){
  return Math.floor(((dist%TOTAL_DIST+TOTAL_DIST)%TOTAL_DIST)/SEG_LEN)%SEGS_TOT;
}
function segPos(dist){
  const raw=(dist%TOTAL_DIST+TOTAL_DIST)%TOTAL_DIST;
  const i=Math.floor(raw/SEG_LEN)%SEGS_TOT;
  const f=(raw-i*SEG_LEN)/SEG_LEN;
  const s=segs[i], n=segs[(i+1)%SEGS_TOT];
  return {
    x:s.x+(n.x-s.x)*f, y:s.y+(n.y-s.y)*f, z:s.z+(n.z-s.z)*f,
    ay:s.ay+(n.ay-s.ay)*f, curve:s.curve, idx:i
  };
}

// ── Three.js renderer + scene ───────────────────────────────────────────────
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x5599dd);
scene.fog=new THREE.Fog(0x5599dd,90,260);
const camera=new THREE.PerspectiveCamera(68,1,0.4,300);

// sky dome
scene.add(Object.assign(
  new THREE.Mesh(
    new THREE.SphereGeometry(240,16,8),
    new THREE.MeshBasicMaterial({color:0x5599dd,side:THREE.BackSide})
  )
));
// sun disc
{
  const sm=new THREE.Mesh(new THREE.CircleGeometry(14,20),new THREE.MeshBasicMaterial({color:0xffee88}));
  sm.position.set(90,55,-210); scene.add(sm);
}
// horizon haze
{
  const hm=new THREE.Mesh(
    new THREE.PlaneGeometry(600,30),
    new THREE.MeshBasicMaterial({color:0xffeedd,transparent:true,opacity:0.25,depthWrite:false})
  );
  hm.rotation.x=-Math.PI/2; hm.position.y=0.1; scene.add(hm);
}

// ── Road ribbon mesh ─────────────────────────────────────────────────────────
const NVERTS=SEGS_VIS*2;
function makeMesh(idx,col){
  const geo=new THREE.BufferGeometry();
  const pos=new Float32Array(NVERTS*3);
  const clr=new Float32Array(NVERTS*3);
  const indices=[];
  for(let i=0;i<SEGS_VIS-1;i++){
    const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;
    indices.push(a,b,c,c,b,d);
  }
  geo.setIndex(indices);
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('color',new THREE.BufferAttribute(clr,3));
  const mat=new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide});
  const mesh=new THREE.Mesh(geo,mat);
  mesh.frustumCulled=false;
  scene.add(mesh);
  return {geo,pos,clr,mesh};
}
const roadBuf  = makeMesh(0);
const grassBuf = makeMesh(1);
const shoulderBuf = makeMesh(2);

const _right=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0), _dir=new THREE.Vector3();

function updateRoad(playerDist){
  const si=getSegIdx(playerDist);
  const rp=roadBuf.pos, rc=roadBuf.clr;
  const gp=grassBuf.pos, gc=grassBuf.clr;
  const sp=shoulderBuf.pos, sc=shoulderBuf.clr;
  for(let i=0;i<SEGS_VIS;i++){
    const idx=(si+i)%SEGS_TOT;
    const s=segs[idx];
    _dir.set(s.dx,s.dy,s.dz).normalize();
    _right.crossVectors(_dir,_up).normalize();
    const lx=s.x-_right.x*ROAD_W*.5, ly=s.y-_right.y*ROAD_W*.5, lz=s.z-_right.z*ROAD_W*.5;
    const rx=s.x+_right.x*ROAD_W*.5, ry=s.y+_right.y*ROAD_W*.5, rz=s.z+_right.z*ROAD_W*.5;
    const li=i*2*3, ri=(i*2+1)*3;
    // road
    rp[li]=lx;rp[li+1]=ly;rp[li+2]=lz;
    rp[ri]=rx;rp[ri+1]=ry;rp[ri+2]=rz;
    const stripe=(Math.floor(i/4)%2)?.34:.31;
    rc[li]=stripe;rc[li+1]=stripe;rc[li+2]=stripe;
    rc[ri]=stripe;rc[ri+1]=stripe;rc[ri+2]=stripe;
    // shoulder (white edge)
    const sw=ROAD_W*.56;
    const slx=s.x-_right.x*sw, sly=s.y-_right.y*sw-.01, slz=s.z-_right.z*sw;
    const srx=s.x+_right.x*sw, sry=s.y+_right.y*sw-.01, srz=s.z+_right.z*sw;
    sp[li]=slx;sp[li+1]=sly;sp[li+2]=slz;
    sp[ri]=srx;sp[ri+1]=sry;sp[ri+2]=srz;
    const wh=(Math.floor(i/3)%2)?.95:.2;
    sc[li]=wh;sc[li+1]=wh;sc[li+2]=wh;
    sc[ri]=wh;sc[ri+1]=wh;sc[ri+2]=wh;
    // grass
    const gw=ROAD_W*1.9;
    const glx=s.x-_right.x*gw,gly=s.y-_right.y*gw-.05,glz=s.z-_right.z*gw;
    const grx=s.x+_right.x*gw,gry=s.y+_right.y*gw-.05,grz=s.z+_right.z*gw;
    gp[li]=glx;gp[li+1]=gly;gp[li+2]=glz;
    gp[ri]=grx;gp[ri+1]=gry;gp[ri+2]=grz;
    const g=(Math.floor(i/6)%2)?.2:.15;
    gc[li]=0;gc[li+1]=g;gc[li+2]=0;
    gc[ri]=0;gc[ri+1]=g;gc[ri+2]=0;
  }
  [roadBuf,grassBuf,shoulderBuf].forEach(b=>{
    b.geo.attributes.position.needsUpdate=true;
    b.geo.attributes.color.needsUpdate=true;
  });
}

// ── Sprite texture factory ────────────────────────────────────────────────
function makeBikeTex(color,crashed=false){
  const tc=document.createElement('canvas');
  tc.width=80;tc.height=68;
  const x=tc.getContext('2d');
  x.save();x.translate(40,62);
  if(crashed){
    x.rotate(.5);
    x.fillStyle=color;x.fillRect(-20,-6,40,12);
    x.fillStyle='#555';
    x.beginPath();x.arc(-18,8,8,0,Math.PI*2);x.fill();
    x.beginPath();x.arc(18,8,8,0,Math.PI*2);x.fill();
    x.fillStyle='#fcb';x.fillRect(-8,-22,12,12);
    x.beginPath();x.arc(-2,-28,7,0,Math.PI*2);x.fill();
  } else {
    // rear wheel
    x.fillStyle='#1a1a1a';
    x.beginPath();x.ellipse(0,0,8,9,0,0,Math.PI*2);x.fill();
    x.fillStyle='#555';
    x.beginPath();x.ellipse(0,0,4,5,0,0,Math.PI*2);x.fill();
    // front wheel
    x.fillStyle='#1a1a1a';
    x.beginPath();x.ellipse(-16,-17,7,8,-.28,0,Math.PI*2);x.fill();
    // frame
    x.fillStyle=color;
    x.beginPath();x.moveTo(2,-2);x.lineTo(-7,-22);x.lineTo(-17,-18);x.lineTo(-10,-5);x.closePath();x.fill();
    // seat
    x.fillStyle='#222';x.fillRect(-5,-24,14,6);
    // rider body
    x.fillStyle='#111';x.fillRect(-3,-42,11,18);
    // helmet
    x.fillStyle='#111';
    x.beginPath();x.arc(2,-46,7,0,Math.PI*2);x.fill();
    x.fillStyle=color;x.fillRect(-2,-50,8,4);
  }
  x.restore();
  const t=new THREE.CanvasTexture(tc);
  return t;
}

// ── NPC class ─────────────────────────────────────────────────────────────────
class NPC{
  constructor(i,startDist,color,name){
    this.i=i; this.dist=startDist; this.color=color; this.name=name;
    this.latOff=(Math.random()-.5)*8;
    this.targetLat=0;
    this.speed=35+Math.random()*10;
    this.baseSpeed=this.speed;
    this.maxSpeed=52+i*2;
    this.hp=100; this.crashed=false; this.crashTimer=0;
    this.flyOff=false; this.flyTimer=0;
    this.flyVel=new THREE.Vector3();
    this.lean=0; this.lap=1; this.finished=false;
    this.tex=makeBikeTex(color);
    this.mat=new THREE.SpriteMaterial({map:this.tex,transparent:true});
    this.spr=new THREE.Sprite(this.mat);
    this.spr.scale.set(5.5,4.8,1);
    scene.add(this.spr);
    // shadow
    this.shd=new THREE.Mesh(
      new THREE.CircleGeometry(1.8,8),
      new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.3})
    );
    this.shd.rotation.x=-Math.PI/2;
    scene.add(this.shd);
  }
  worldPos(){
    const p=segPos(this.dist);
    const s=segs[p.idx];
    _dir.set(s.dx,s.dy,s.dz).normalize();
    _right.crossVectors(_dir,_up).normalize();
    return new THREE.Vector3(
      p.x+_right.x*this.latOff,
      p.y+_right.y*this.latOff+2.5,
      p.z+_right.z*this.latOff
    );
  }
  update(dt,playerDist){
    if(this.finished){this.spr.visible=false;this.shd.visible=false;return;}
    if(this.flyOff){
      this.flyTimer-=dt;
      const wp=this.spr.position;
      wp.x+=this.flyVel.x*dt; wp.y+=this.flyVel.y*dt; wp.z+=this.flyVel.z*dt;
      this.flyVel.y-=20*dt;
      if(this.flyTimer<=0){
        this.flyOff=false; this.crashed=true; this.crashTimer=3.5;
        if(this.tex)this.tex.dispose();
        this.tex=makeBikeTex(this.color,true);
        this.mat.map=this.tex; this.mat.needsUpdate=true;
      }
      return;
    }
    if(this.crashed){
      this.crashTimer-=dt;
      if(this.crashTimer<=0){
        this.crashed=false;
        this.hp=Math.max(this.hp,15);
        if(this.tex)this.tex.dispose();
        this.tex=makeBikeTex(this.color,false);
        this.mat.map=this.tex; this.mat.needsUpdate=true;
      }
      const wp=this.worldPos();
      this.spr.position.set(wp.x,wp.y-1,wp.z);
      this.shd.position.set(wp.x,wp.y-2.5,wp.z);
      return;
    }
    // rubber-band speed
    const gap=playerDist-this.dist;
    let tgt=this.baseSpeed;
    if(gap>100) tgt=this.maxSpeed*1.15;
    else if(gap>50) tgt=this.maxSpeed;
    else if(gap<-80) tgt=this.baseSpeed*.65;
    else if(gap<-30) tgt=this.baseSpeed*.82;
    this.speed+=(tgt-this.speed)*dt*1.8;
    this.dist+=this.speed*dt;
    // lap
    if(this.dist>TOTAL_DIST*this.lap){
      this.lap++;
      if(this.lap>LAPS){this.finished=true;return;}
    }
    // lateral weave
    this.targetLat+=(Math.random()-.5)*5*dt;
    this.targetLat=Math.max(-ROAD_W*.4,Math.min(ROAD_W*.4,this.targetLat));
    this.latOff+=(this.targetLat-this.latOff)*dt*2.2;
    // lean
    const si=getSegIdx(this.dist);
    this.lean+=(segs[si].curve*-50-this.lean)*dt*4;
    // sprite
    const wp=this.worldPos();
    this.spr.position.copy(wp);
    this.shd.position.set(wp.x,wp.y-2.5,wp.z);
    this.spr.visible=true; this.shd.visible=true;
  }
  hit(dmg,kick,fromDir){
    if(this.crashed||this.flyOff||this.finished) return false;
    this.hp-=dmg;
    this.mat.color.set(0xff2222);
    setTimeout(()=>{if(this.mat)this.mat.color.set(0xffffff);},220);
    if(kick||this.hp<=0){
      this.flyOff=true; this.flyTimer=0.75;
      this.flyVel.set(fromDir*14,9,-4);
    }
    return true;
  }
  dispose(){
    scene.remove(this.spr); scene.remove(this.shd);
    if(this.tex)this.tex.dispose();
  }
}

// ── Player bike canvas overlay ─────────────────────────────────────────────
const pcanvas=document.getElementById('pcanvas');
const px=pcanvas.getContext('2d');

function drawPlayerBike(lean,crashed,hp){
  const W=200,H=190;
  px.clearRect(0,0,W,H);
  px.save();
  px.translate(W*.5,H*.92);
  if(crashed){
    px.rotate(.4);
    px.fillStyle='#2244ff';px.fillRect(-30,-8,60,16);
    px.fillStyle='#555';
    px.beginPath();px.arc(-28,12,14,0,Math.PI*2);px.fill();
    px.beginPath();px.arc(28,12,14,0,Math.PI*2);px.fill();
    px.fillStyle='#fcb';px.fillRect(-15,-28,20,14);
    px.beginPath();px.arc(-5,-38,11,0,Math.PI*2);px.fill();
    px.restore();return;
  }
  px.rotate(lean*.28);
  // rear wheel
  px.fillStyle='#111';
  px.beginPath();px.ellipse(10,0,15,18,0,0,Math.PI*2);px.fill();
  px.fillStyle='#444';
  px.beginPath();px.ellipse(10,0,8,10,0,0,Math.PI*2);px.fill();
  // front wheel
  px.fillStyle='#111';
  px.beginPath();px.ellipse(-28,-34,13,16,-.28,0,Math.PI*2);px.fill();
  px.fillStyle='#444';
  px.beginPath();px.ellipse(-28,-34,7,8,-.28,0,Math.PI*2);px.fill();
  // frame
  px.fillStyle='#2244dd';
  px.beginPath();px.moveTo(12,-4);px.lineTo(-5,-44);px.lineTo(-28,-38);px.lineTo(-14,-8);px.closePath();px.fill();
  // exhaust pipe
  px.strokeStyle='#777';px.lineWidth=4;
  px.beginPath();px.moveTo(8,-12);px.quadraticCurveTo(18,2,14,16);px.stroke();
  // seat
  px.fillStyle='#111';px.fillRect(-6,-48,26,10);
  // rider body
  px.fillStyle='#1a1a6a';px.fillRect(-8,-82,22,34);
  // jacket stripe
  px.fillStyle='#f80';px.fillRect(-8,-70,22,7);
  // arms
  px.fillStyle='#1a1a6a';
  px.save();px.translate(-8,-74);px.rotate(-.7);px.fillRect(0,-4,26,9);px.restore();
  px.save();px.translate(-8,-65);px.rotate(-.38);px.fillRect(0,-4,24,8);px.restore();
  // helmet
  px.fillStyle='#111';
  px.beginPath();px.arc(2,-88,15,0,Math.PI*2);px.fill();
  px.fillStyle='#f80';px.fillRect(-5,-96,16,8);
  px.fillStyle='rgba(120,200,255,.5)';px.fillRect(-3,-91,14,8);
  // low HP flash
  if(hp<40){
    px.save();px.globalAlpha=.32*(1-hp/40);px.fillStyle='#f00';
    px.beginPath();px.arc(2,-88,15,0,Math.PI*2);px.fill();
    px.restore();
  }
  px.restore();
}

// ── Combat helpers ─────────────────────────────────────────────────────────
let npcs=[], gameRunning=false, gameTime=0;
const keys={up:false,down:false,left:false,right:false};

function showMsg(t,c='#ff0'){
  const el=document.getElementById('combat-msg');
  el.textContent=t; el.style.color=c; el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.style.opacity='0',900);
}
function doPunch(dir){
  if(!gameRunning||P.cooldownP>0||P.crashed) return;
  P.cooldownP=.8;
  let h=false;
  for(const n of npcs){
    if(Math.abs(n.dist-P.dist)<9&&Math.abs(n.latOff-P.latOff)<8){
      if(n.hit(25,false,dir)) h=true;
    }
  }
  showMsg(h?'PUNCH! -25':'MISS!',h?'#f80':'#888');
}
function doKick(dir){
  if(!gameRunning||P.cooldownK>0||P.crashed) return;
  P.cooldownK=1.5;
  let h=false;
  for(const n of npcs){
    if(Math.abs(n.dist-P.dist)<11&&Math.abs(n.latOff-P.latOff)<10){
      if(n.hit(45,true,dir)) h=true;
    }
  }
  showMsg(h?'KICK! -45':'MISS!',h?'#c0f':'#888');
}

// ── Player state ─────────────────────────────────────────────────────────
const P={
  dist:0,latOff:0,speed:0,maxSpeed:60,
  hp:100,boost:100,lap:1,lean:0,
  cooldownP:0,cooldownK:0,
  crashTimer:0,crashed:false,finished:false
};

function resetPlayer(){
  Object.assign(P,{dist:0,latOff:0,speed:0,hp:100,boost:100,lap:1,lean:0,
    cooldownP:0,cooldownK:0,crashTimer:0,crashed:false,finished:false});
}

function triggerCrash(msg='CRASHED!'){
  P.crashed=true; P.crashTimer=2.5; P.speed=0;
  P.hp=Math.max(5,P.hp);
  showMsg(msg,'#f00');
}

// ── Camera ─────────────────────────────────────────────────────────────────
const _camRight=new THREE.Vector3();
function updateCamera(){
  const p=segPos(P.dist);
  const s=segs[p.idx];
  _dir.set(s.dx,s.dy,s.dz).normalize();
  _right.crossVectors(_dir,_up).normalize();
  const lx=_right.x*P.latOff, lz=_right.z*P.latOff;
  camera.position.set(p.x-_dir.x*9+lx, p.y+4.5, p.z-_dir.z*9+lz);
  const ai=(p.idx+24)%SEGS_TOT;
  const sa=segs[ai];
  camera.lookAt(sa.x+lx, sa.y+1.5, sa.z+lz);
}

// ── HUD ─────────────────────────────────────────────────────────────────────
function updateHUD(){
  document.getElementById('hp-bar').style.width=P.hp+'%';
  document.getElementById('boost-bar').style.width=P.boost+'%';
  document.getElementById('speed-text').textContent=Math.round(P.speed*2.2)+' mph';
  let pos=1;
  for(const n of npcs) if(!n.finished&&n.dist>P.dist) pos++;
  document.getElementById('pos-text').textContent=`POS: ${pos}/${NUM_NPCS+1}`;
  document.getElementById('lap-text').textContent=`LAP ${Math.min(P.lap,LAPS)}/${LAPS}`;
}

// ── Game start / end ─────────────────────────────────────────────────────
function startGame(){
  document.getElementById('overlay').style.display='none';
  document.getElementById('finish-overlay').style.display='none';
  resetPlayer();
  for(const n of npcs) n.dispose();
  npcs=[];
  for(let i=0;i<NUM_NPCS;i++)
    npcs.push(new NPC(i,-28-i*18,NPC_COLORS[i],NPC_NAMES[i]));
  gameTime=0; gameRunning=true;
}
function restartGame(){ startGame(); }

function showFinish(){
  const el=document.getElementById('finish-overlay');
  el.style.display='flex';
  let pos=1;
  for(const n of npcs) if(n.dist>P.dist||n.finished) pos++;
  const m=Math.floor(gameTime/60);
  const s=(gameTime%60).toFixed(1).padStart(4,'0');
  document.getElementById('finish-title').textContent=pos===1?'YOU WIN!':'RACE OVER';
  document.getElementById('finish-stats').innerHTML=
    `POSITION: ${pos} / ${NUM_NPCS+1}<br>TIME: ${m}:${s}<br>HP: ${Math.round(P.hp)}%`;
}

// ── Main update ─────────────────────────────────────────────────────────────
function update(dt){
  if(!gameRunning) return;
  gameTime+=dt;
  P.cooldownP=Math.max(0,P.cooldownP-dt);
  P.cooldownK=Math.max(0,P.cooldownK-dt);

  if(P.crashed){
    P.crashTimer-=dt;
    if(P.crashTimer<=0){P.crashed=false;P.speed=8;}
    updateRoad(P.dist); updateCamera();
    for(const n of npcs) n.update(dt,P.dist);
    drawPlayerBike(0,true,P.hp);
    updateHUD();
    return;
  }

  // throttle / brake
  const boost=keys.up&&P.boost>0;
  const tSpd=boost?P.maxSpeed*1.22:keys.up?P.maxSpeed:keys.down?12:P.maxSpeed*.45;
  P.speed+=(tSpd-P.speed)*Math.min(1,(keys.up?16:28)*dt);
  P.speed=Math.max(0,P.speed);
  P.boost=boost?Math.max(0,P.boost-dt*28):Math.min(100,P.boost+dt*9);

  // steering
  const sr=13*(P.speed/P.maxSpeed+.28);
  if(keys.left)  P.latOff-=sr*dt;
  if(keys.right) P.latOff+=sr*dt;
  P.latOff=Math.max(-ROAD_W*.44,Math.min(ROAD_W*.44,P.latOff));

  // lean
  const lt=keys.left?-1:keys.right?1:0;
  P.lean+=(lt*.95-P.lean)*dt*6;

  P.dist+=P.speed*dt;

  // lap
  if(P.dist>TOTAL_DIST*P.lap){
    P.lap++;
    if(P.lap>LAPS){P.finished=true;gameRunning=false;showFinish();return;}
    showMsg(`LAP ${P.lap}!`,'#0ff');
  }

  // off road
  if(Math.abs(P.latOff)>ROAD_W*.46){
    P.hp-=dt*20;
    if(P.hp<=0) triggerCrash('WIPEOUT!');
  }

  // NPC collisions
  for(const n of npcs){
    if(n.crashed||n.flyOff||n.finished) continue;
    if(Math.abs(n.dist-P.dist)<5&&Math.abs(n.latOff-P.latOff)<4){
      P.hp-=dt*28; P.speed*=.88;
      if(P.hp<=0) triggerCrash('CRASHED!');
    }
  }

  for(const n of npcs) n.update(dt,P.dist);
  updateRoad(P.dist);
  updateCamera();
  drawPlayerBike(P.lean,false,P.hp);
  updateHUD();
}

// ── Render loop ──────────────────────────────────────────────────────────────
function resize(){
  const W=innerWidth,H=innerHeight;
  renderer.setSize(W,H);
  camera.aspect=W/H; camera.updateProjectionMatrix();
}
window.addEventListener('resize',resize); resize();

let lastT=0;
function loop(t){
  requestAnimationFrame(loop);
  const dt=Math.min((t-lastT)/1000,.05);
  lastT=t;
  update(dt);
  renderer.render(scene,camera);
}
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});

// ── Keyboard ──────────────────────────────────────────────────────────────
window.addEventListener('keydown',e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') keys.up=true;
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') keys.down=true;
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=true;
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=true;
  else if(e.key==='z'||e.key==='Z') doPunch(-1);
  else if(e.key==='x'||e.key==='X') doKick(1);
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
},{passive:false});
window.addEventListener('keyup',e=>{
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W') keys.up=false;
  else if(e.key==='ArrowDown'||e.key==='s'||e.key==='S') keys.down=false;
  else if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A') keys.left=false;
  else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D') keys.right=false;
});

// ── Touch controls ────────────────────────────────────────────────────────
function bindHold(id,key){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();keys[key]=true;},{passive:false});
  el.addEventListener('touchend',  e=>{e.preventDefault();keys[key]=false;},{passive:false});
  el.addEventListener('mousedown', ()=>keys[key]=true);
  el.addEventListener('mouseup',   ()=>keys[key]=false);
  el.addEventListener('mouseleave',()=>keys[key]=false);
}
bindHold('du','up'); bindHold('dd','down'); bindHold('dl','left'); bindHold('dr','right');

function bindTap(id,fn){
  const el=document.getElementById(id);
  el.addEventListener('touchstart',e=>{e.preventDefault();fn();},{passive:false});
  el.addEventListener('mousedown', fn);
}
bindTap('punch-btn',()=>doPunch(-1));
bindTap('kick-btn', ()=>doKick(1));

// Initial render before game starts
updateRoad(0); updateCamera(); renderer.render(scene,camera);
</script>
