<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Moto Mayhem - Road Rash</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace}
#gameCanvas{display:block;width:100%;height:100%;touch-action:none;position:fixed;top:0;left:0}

.screen{position:fixed;inset:0;display:none;flex-direction:column;justify-content:center;align-items:center;
  background:#0a0a0a;z-index:100;color:#fff;font-family:'Courier New',monospace;overflow-y:auto;padding:20px}
.screen.active{display:flex}

h1.game-title{font-size:clamp(36px,8vw,72px);color:#FF6600;
  text-shadow:0 0 20px #FF6600,0 0 40px #FF3300;letter-spacing:4px;margin-bottom:8px;text-align:center}
.tagline{color:#666;font-size:13px;letter-spacing:4px;margin-bottom:20px;text-align:center}

.btn{padding:13px 28px;font-size:16px;font-weight:bold;background:#FF6600;color:#000;border:none;
  border-radius:8px;cursor:pointer;font-family:'Courier New',monospace;transition:all .15s;
  letter-spacing:1px;margin:5px;min-width:170px;display:inline-block;text-align:center}
.btn:hover{background:#FF8800;transform:translateY(-2px)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:transparent;color:#FF6600;border:2px solid #FF6600}
.btn.sec:hover{background:rgba(255,102,0,.1)}
.btn.dim{opacity:.4;cursor:not-allowed;pointer-events:none}

.money{font-size:18px;color:#FFD700;background:rgba(255,215,0,.1);border:2px solid #FFD700;
  padding:7px 18px;border-radius:8px;margin:8px 0}

.course-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;max-width:860px;width:90%;margin:16px 0}
.c-card{padding:14px;border-radius:10px;border:2px solid #333;text-align:center;
  cursor:pointer;transition:all .15s;background:#111}
.c-card:hover:not(.locked){border-color:#FF6600;background:#1a0a00}
.c-card.locked{opacity:.4;cursor:not-allowed}
.c-card.sel{border-color:#FF6600;background:rgba(255,102,0,.15)}
.c-card .cname{font-size:13px;font-weight:bold;color:#FF6600;margin-top:6px}
.c-card .cico{font-size:34px}
.c-card .creq{font-size:11px;color:#666;margin-top:3px}

.bike-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px;max-width:780px;width:90%;margin:16px 0}
.b-card{padding:12px;border-radius:10px;border:2px solid #333;text-align:center;
  cursor:pointer;transition:all .15s;background:#111}
.b-card:hover{border-color:#FF6600}
.b-card.owned{border-color:#00BB00}
.b-card.equip{background:rgba(0,255,0,.07);border-color:#00FF00}
.sbar{height:7px;background:#333;border-radius:4px;margin:2px 0}
.sbar-f{height:100%;border-radius:4px;background:#FF6600}

.res-pos{font-size:80px;color:#FFD700;text-shadow:0 0 20px #FFD700;line-height:1}
.res-box{background:rgba(255,255,255,.04);border:2px solid #333;border-radius:12px;
  padding:18px;min-width:280px;margin:14px 0;text-align:left;width:90%;max-width:400px}

#hud{position:fixed;top:0;left:0;right:0;pointer-events:none;z-index:40;
  display:none;padding:8px 14px}
#hud.vis{display:block}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.hi{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.18);border-radius:6px;
  padding:4px 10px;font-size:12px;color:#fff}
.hi .lbl{font-size:9px;color:#666;display:block}
.hi .val{font-size:15px;font-weight:bold;color:#FF6600}
.hb-wrap{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.18);border-radius:6px;padding:4px 10px}
.hb-out{width:110px;height:10px;background:#333;border-radius:5px;overflow:hidden}
.hb-in{height:100%;border-radius:5px;transition:width .15s,background .3s}
#pausebtn{background:rgba(0,0,0,.65);border:1px solid rgba(255,255,255,.25);color:#fff;
  padding:4px 12px;border-radius:6px;cursor:pointer;font-family:monospace;font-size:13px;
  pointer-events:auto}

#mc{position:fixed;bottom:0;left:0;right:0;height:155px;display:none;z-index:50;pointer-events:none}
#mc.vis{display:block}
#dpad{position:absolute;left:16px;bottom:8px;width:135px;height:135px;pointer-events:auto}
.db{position:absolute;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.35);
  border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:20px;
  color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;
  active:background:rgba(255,255,255,.35)}
.db.act{background:rgba(255,102,0,.5);border-color:#FF6600}
#du{top:0;left:42px;width:50px;height:50px}
#dd{bottom:0;left:42px;width:50px;height:50px}
#dl{left:0;top:42px;width:50px;height:50px}
#dr{right:0;top:42px;width:50px;height:50px}
#pbtns{position:absolute;right:16px;bottom:14px;display:flex;gap:14px;pointer-events:auto}
.pb{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:bold;color:#fff;cursor:pointer;border:3px solid rgba(255,255,255,.5);
  -webkit-tap-highlight-color:transparent;user-select:none;text-align:center;line-height:1.2}
.pb.act{transform:scale(.93)}
#pbl{background:rgba(255,80,0,.5)}
#pbr{background:rgba(0,100,255,.5)}

#pauseov{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;
  flex-direction:column;align-items:center;justify-content:center;z-index:200;color:#fff}
#pauseov.act{display:flex}

#notifs{position:fixed;top:75px;left:50%;transform:translateX(-50%);
  z-index:150;pointer-events:none;width:280px;text-align:center}
.notif{background:rgba(255,102,0,.92);color:#fff;font-weight:bold;padding:6px 18px;
  border-radius:20px;margin:4px 0;font-family:monospace;font-size:13px;
  animation:nslide 2.1s ease-out forwards}
@keyframes nslide{0%{transform:translateY(-16px);opacity:0}12%{transform:translateY(0);opacity:1}
  80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}

#tut{position:fixed;bottom:175px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,.85);border:2px solid #FF6600;border-radius:10px;
  padding:10px 18px;color:#fff;font-size:13px;z-index:60;text-align:center;
  pointer-events:none;transition:opacity .5s;opacity:0;white-space:nowrap}

@media(max-width:500px){
  .course-grid{grid-template-columns:repeat(2,1fr)}
  .bike-grid{grid-template-columns:repeat(2,1fr)}
  h1.game-title{font-size:36px}
}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<!-- HUD -->
<div id="hud">
  <div class="hrow">
    <div class="hi"><span class="lbl">SPEED</span><span class="val" id="hspd">0</span><span style="font-size:9px;color:#666"> mph</span></div>
    <div class="hi"><span class="lbl">POS</span><span class="val" id="hpos">1st</span></div>
    <div class="hi"><span class="lbl">DIST</span><span class="val" id="hdst">0</span><span style="font-size:9px;color:#666"> m</span></div>
    <div class="hi"><span class="lbl">CASH</span><span class="val" id="hcash">$0</span></div>
    <button id="pausebtn" onclick="G.pause()">❚❚</button>
  </div>
  <div class="hrow" style="margin-top:5px">
    <div class="hb-wrap"><span style="font-size:9px;color:#666">HEALTH</span>
      <div class="hb-out"><div class="hb-in" id="hhp" style="width:100%;background:#44FF44"></div></div>
    </div>
    <div class="hi" id="hcombo" style="display:none"><span class="lbl">COMBO</span><span class="val" style="color:#FFD700" id="hcomboval">x1</span></div>
  </div>
</div>

<!-- Notifications -->
<div id="notifs"></div>
<div id="tut"></div>

<!-- Mobile Controls -->
<div id="mc">
  <div id="dpad">
    <div class="db" id="du">▲</div>
    <div class="db" id="dl">◄</div>
    <div class="db" id="dr">►</div>
    <div class="db" id="dd">▼</div>
  </div>
  <div id="pbtns">
    <div class="pb" id="pbl">👊<br>LEFT</div>
    <div class="pb" id="pbr">RIGHT<br>👊</div>
  </div>
</div>

<!-- Pause -->
<div id="pauseov">
  <h2 style="font-size:44px;color:#FF6600;margin-bottom:24px">PAUSED</h2>
  <button class="btn" onclick="G.pause()">▶ RESUME</button>
  <button class="btn sec" onclick="G.restartRace()">↺ RESTART</button>
  <button class="btn sec" onclick="G.quitMenu()">⌂ MENU</button>
</div>

<!-- MAIN MENU -->
<div id="s-menu" class="screen active">
  <h1 class="game-title">MOTO MAYHEM</h1>
  <p class="tagline">ROAD RASH REBORN</p>
  <div class="money">💰 $<span id="mmoney">0</span></div>
  <div>
    <button class="btn" onclick="G.show('courseSelect')">▶ RACE</button>
    <button class="btn sec" onclick="G.show('shop')">🏍 SHOP</button>
  </div>
  <div>
    <button class="btn sec" onclick="G.show('stats')">📊 STATS</button>
    <button class="btn sec" onclick="G.show('settings')">⚙ SETTINGS</button>
  </div>
  <p style="color:#444;margin-top:18px;font-size:11px">↑↓ Speed  ←→ Lane  Z/X Punch</p>
</div>

<!-- COURSE SELECT -->
<div id="s-courseSelect" class="screen">
  <h2 style="color:#FF6600;font-size:26px">SELECT COURSE</h2>
  <div class="money">💰 $<span id="csmoney">0</span></div>
  <div class="course-grid" id="cgrid"></div>
  <div>
    <button class="btn" onclick="G.goPreRace()">RACE! →</button>
    <button class="btn sec" onclick="G.show('menu')">← BACK</button>
  </div>
</div>

<!-- PRE-RACE -->
<div id="s-preRace" class="screen">
  <h2 style="color:#FF6600;font-size:24px">BRIEFING</h2>
  <div id="pr-course" style="color:#888;margin:6px 0;font-size:15px"></div>
  <div style="display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:12px 0">
    <div>
      <h3 style="color:#FFD700;margin-bottom:8px;font-size:14px">YOUR BIKE</h3>
      <div id="pr-bike" style="background:#111;border:2px solid #333;border-radius:8px;padding:12px;min-width:170px"></div>
    </div>
    <div>
      <h3 style="color:#FF4444;margin-bottom:8px;font-size:14px">OPPONENTS</h3>
      <div id="pr-opps"></div>
    </div>
  </div>
  <button class="btn" onclick="G.beginRace()">🏁 GO!</button>
  <button class="btn sec" onclick="G.show('courseSelect')" style="margin-top:6px">← BACK</button>
</div>

<!-- RESULTS -->
<div id="s-results" class="screen">
  <div class="res-pos" id="rpos"></div>
  <h2 id="rtitle" style="margin:8px 0;font-size:22px"></h2>
  <div class="res-box" id="rdetails"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center">
    <button class="btn" id="btn-next" onclick="G.nextCourse()">NEXT →</button>
    <button class="btn sec" onclick="G.show('shop')">🏍 SHOP</button>
    <button class="btn sec" onclick="G.show('menu')">⌂ MENU</button>
  </div>
</div>

<!-- SHOP -->
<div id="s-shop" class="screen">
  <h2 style="color:#FF6600;font-size:26px">BIKE SHOP</h2>
  <div class="money">💰 $<span id="shopmoney">0</span></div>
  <div class="bike-grid" id="bgrid"></div>
  <button class="btn sec" onclick="G.show('menu')" style="margin-top:8px">← BACK</button>
</div>

<!-- STATS -->
<div id="s-stats" class="screen">
  <h2 style="color:#FF6600;font-size:26px;margin-bottom:16px">CAREER STATS</h2>
  <div id="statsbox" style="background:#111;border:2px solid #333;border-radius:12px;padding:18px;min-width:260px"></div>
  <button class="btn sec" onclick="G.show('menu')" style="margin-top:18px">← BACK</button>
</div>

<!-- SETTINGS -->
<div id="s-settings" class="screen">
  <h2 style="color:#FF6600;font-size:26px;margin-bottom:16px">SETTINGS</h2>
  <div style="background:#111;border:2px solid #333;border-radius:12px;padding:18px;min-width:260px">
    <label style="display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer;font-size:15px">
      <input type="checkbox" id="s-sound" onchange="G.setSnd(this.checked)" style="width:18px;height:18px"> 🔊 Sound
    </label>
    <label style="display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer;font-size:15px">
      <input type="checkbox" id="s-haptic" onchange="G.setHap(this.checked)" style="width:18px;height:18px"> 📳 Haptic
    </label>
    <div style="margin:14px 0">
      <div style="font-size:11px;color:#666;margin-bottom:5px">DIFFICULTY</div>
      <select id="s-diff" onchange="G.setDiff(this.value)"
        style="background:#222;color:#fff;border:1px solid #444;padding:8px;border-radius:6px;width:100%;font-family:monospace;font-size:14px">
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
        <option value="insane">Insane</option>
      </select>
    </div>
    <button class="btn sec" style="width:100%;background:#1a0000;border-color:#FF4444;color:#FF4444;margin-top:8px"
      onclick="if(confirm('Reset all progress?')){G.resetSave()}">⚠ RESET PROGRESS</button>
  </div>
  <button class="btn sec" onclick="G.show('menu')" style="margin-top:16px">← BACK</button>
</div>

<script>
// ================================================================
// MOTO MAYHEM - Road Rash Style Racing Game
// ================================================================

const BIKES = [
  {id:'starter', name:'Starter 50',   cost:0,    spd:85,  acc:10, dur:100, col:'#FF4444', desc:'Basic but reliable'},
  {id:'sport',   name:'Sport 250',    cost:500,  spd:130, acc:16, dur:80,  col:'#4488FF', desc:'Fast and nimble'},
  {id:'heavy',   name:'Heavy Hog',    cost:800,  spd:110, acc:13, dur:150, col:'#AA6600', desc:'Tough bruiser'},
  {id:'custom',  name:'Custom Racer', cost:1500, spd:165, acc:22, dur:90,  col:'#00CC88', desc:'Built for speed'},
  {id:'legend',  name:'Legendary',    cost:3000, spd:210, acc:30, dur:120, col:'#FFD700', desc:'Apex predator'},
];

const COURSES = [
  {id:'desert',   name:'Desert Highway', ico:'🏜', req:0, dist:3000,
   sky:'#E8760A', sky2:'#FFD060', road:'#998866', stripe:'#FFF8', grass:'#C8A020', obj:'🌵',
   reward:200, ais:0.72},
  {id:'city',     name:'City Streets',   ico:'🏙', req:1, dist:4000,
   sky:'#1a2a4a', sky2:'#2a3a6a', road:'#444455', stripe:'#FFD700', grass:'#223322', obj:'🏢',
   reward:350, ais:0.80},
  {id:'mountain', name:'Mountain Pass',  ico:'⛰', req:2, dist:5000,
   sky:'#3a88bb', sky2:'#88bbdd', road:'#666677', stripe:'#FFFF', grass:'#336633', obj:'🌲',
   reward:500, ais:0.87},
  {id:'beach',    name:'Beach Road',     ico:'🏖', req:3, dist:4500,
   sky:'#00AAEE', sky2:'#88DDFF', road:'#D4C8A0', stripe:'#FF6600', grass:'#FFD700', obj:'🌴',
   reward:650, ais:0.92},
  {id:'forest',   name:'Forest Trail',   ico:'🌲', req:4, dist:6000,
   sky:'#1a3a1a', sky2:'#2a5a2a', road:'#556655', stripe:'#FFFF', grass:'#1a4a1a', obj:'🌿',
   reward:800, ais:0.96},
];

const RIDERS = [
  {name:'Crusher', col:'#FF2200', p:'aggressive'},
  {name:'Blaze',   col:'#FF8800', p:'speed'},
  {name:'Rampage', col:'#AA00AA', p:'aggressive'},
  {name:'Shadow',  col:'#667788', p:'tactical'},
  {name:'Viper',   col:'#00AA44', p:'speed'},
  {name:'Wraith',  col:'#4444FF', p:'tactical'},
];

const ORD = ['1st','2nd','3rd','4th','5th','6th'];
const DIFF = {
  easy:  {am:0.72, pd:22, apf:0.002, rm:0.8},
  medium:{am:0.86, pd:18, apf:0.005, rm:1.0},
  hard:  {am:1.00, pd:15, apf:0.008, rm:1.2},
  insane:{am:1.15, pd:12, apf:0.014, rm:1.5},
};

// ----------------------------------------------------------------
// Save
// ----------------------------------------------------------------
const SK = 'motoMayhem2';
function defSave(){return{money:0,bikes:['starter'],equip:'starter',courses:0,
  wins:0,races:0,earned:0,snd:true,hap:false,diff:'medium',first:true}}
function load(){try{return JSON.parse(localStorage.getItem(SK))||defSave()}catch{return defSave()}}
function save(d){try{localStorage.setItem(SK,JSON.stringify(d))}catch{}}

// ----------------------------------------------------------------
// Audio
// ----------------------------------------------------------------
class Audio2 {
  constructor(){this.cx=null;this.eng=null;this.eGain=null;this.on=true}
  init(){
    if(this.cx)return;
    try{this.cx=new(window.AudioContext||window.webkitAudioContext)();
      this.mg=this.cx.createGain();this.mg.gain.value=0.35;this.mg.connect(this.cx.destination)}
    catch{this.on=false}
  }
  _t(f,t,d,v=0.3,f2=null){
    if(!this.on||!this.cx)return;
    const o=this.cx.createOscillator(),g=this.cx.createGain();
    o.type=t;o.frequency.value=f;
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,this.cx.currentTime+d);
    g.gain.setValueAtTime(v,this.cx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.cx.currentTime+d);
    o.connect(g);g.connect(this.mg);o.start();o.stop(this.cx.currentTime+d);
  }
  punch(){this._t(280,'sawtooth',.1,.4,100)}
  hit(){this._t(140,'square',.18,.5,70)}
  crash(){this._t(180,'sawtooth',.35,.6,40)}
  win(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>this._t(f,'sine',.3,.35),i*140))}
  lose(){[350,260,180].forEach((f,i)=>setTimeout(()=>this._t(f,'sawtooth',.25,.3),i*180))}
  coin(){this._t(880,'sine',.12,.25,1047)}
  startEng(spd,max){
    if(!this.on||!this.cx)return;
    const f=75+(spd/max)*220;
    if(this.eng){this.eng.frequency.setTargetAtTime(f,this.cx.currentTime,.1);return}
    this.eng=this.cx.createOscillator();this.eGain=this.cx.createGain();
    this.eng.type='sawtooth';this.eng.frequency.value=f;this.eGain.gain.value=0.07;
    this.eng.connect(this.eGain);this.eGain.connect(this.mg);this.eng.start();
  }
  updEng(spd,max){
    if(!this.eng)return;
    this.eng.frequency.setTargetAtTime(75+(spd/max)*220,this.cx.currentTime,.04);
  }
  stopEng(){
    if(!this.eGain)return;
    this.eGain.gain.setTargetAtTime(0,this.cx.currentTime,.2);
    setTimeout(()=>{try{if(this.eng){this.eng.stop();this.eng=null;this.eGain=null}}catch{}},600);
  }
}

// ----------------------------------------------------------------
// Drawing helpers
// ----------------------------------------------------------------
function drawBike(cx,x,y,col,lean=0,crashed=false,s=1){
  cx.save();cx.translate(x,y);cx.scale(s,s);cx.rotate(lean);
  if(crashed){cx.rotate(1.2);cx.globalAlpha=.65}
  // shadow
  cx.fillStyle='rgba(0,0,0,.3)';cx.beginPath();cx.ellipse(0,26,38,7,0,0,Math.PI*2);cx.fill();
  // rear wheel
  cx.fillStyle='#1a1a1a';cx.beginPath();cx.arc(-24,18,17,0,Math.PI*2);cx.fill();
  cx.fillStyle='#555';cx.beginPath();cx.arc(-24,18,9,0,Math.PI*2);cx.fill();
  // front wheel
  cx.fillStyle='#1a1a1a';cx.beginPath();cx.arc(24,18,15,0,Math.PI*2);cx.fill();
  cx.fillStyle='#555';cx.beginPath();cx.arc(24,18,7,0,Math.PI*2);cx.fill();
  // body
  cx.fillStyle=col;
  cx.beginPath();cx.moveTo(-28,13);cx.lineTo(-8,-12);cx.lineTo(20,-9);cx.lineTo(29,4);cx.lineTo(19,17);cx.lineTo(-20,17);cx.closePath();cx.fill();
  // highlight
  cx.fillStyle='rgba(255,255,255,.22)';
  cx.beginPath();cx.moveTo(-2,-10);cx.lineTo(19,-7);cx.lineTo(24,1);cx.lineTo(14,-1);cx.closePath();cx.fill();
  // exhaust
  cx.fillStyle='#777';cx.fillRect(-33,9,10,4);
  // rider body
  cx.fillStyle='#2a2a2a';cx.fillRect(-14,-29,18,21);
  // helmet
  cx.fillStyle=col;cx.beginPath();cx.arc(-5,-33,11,0,Math.PI*2);cx.fill();
  cx.fillStyle='rgba(0,0,0,.45)';cx.fillRect(-10,-38,12,7);
  cx.globalAlpha=1;cx.restore();
}

function drawCar(cx,x,y,col,s=1){
  cx.save();cx.translate(x,y);cx.scale(s,s);
  cx.fillStyle='rgba(0,0,0,.28)';cx.beginPath();cx.ellipse(0,30,42,7,0,0,Math.PI*2);cx.fill();
  cx.fillStyle=col;cx.fillRect(-40,4,80,26);cx.fillRect(-26,-17,52,22);
  cx.fillStyle='rgba(140,210,255,.55)';cx.fillRect(-22,-13,44,14);
  cx.fillStyle='#111';
  [-30,28].forEach(wx=>{
    cx.beginPath();cx.arc(wx,29,11,0,Math.PI*2);cx.fill();
    cx.fillStyle='#444';cx.beginPath();cx.arc(wx,29,5,0,Math.PI*2);cx.fill();
    cx.fillStyle='#111';
  });
  cx.fillStyle='#FFFF88';cx.fillRect(34,7,7,9);
  cx.fillStyle='#FF5555';cx.fillRect(-41,7,7,9);
  cx.restore();
}

function drawBg(cx,W,H,c,scroll){
  // sky
  const sg=cx.createLinearGradient(0,0,0,H*.54);
  sg.addColorStop(0,c.sky);sg.addColorStop(1,c.sky2);
  cx.fillStyle=sg;cx.fillRect(0,0,W,H*.54);
  // silhouettes
  const fo=(scroll*.08)%W;
  cx.fillStyle=c.sky+'99';
  for(let i=-1;i<4;i++){
    const bx=i*(W/3)-fo;
    cx.beginPath();cx.moveTo(bx,H*.54);cx.lineTo(bx+30,H*.22);cx.lineTo(bx+80,H*.33);
    cx.lineTo(bx+140,H*.18);cx.lineTo(bx+200,H*.54);cx.closePath();cx.fill();
  }
  // road
  const rt=H*.52,rb=H*.91;
  const rg=cx.createLinearGradient(0,rt,0,rb);
  rg.addColorStop(0,'#555');rg.addColorStop(1,c.road);
  cx.fillStyle=rg;cx.fillRect(0,rt,W,rb-rt);
  // grass
  cx.fillStyle=c.grass;cx.fillRect(0,rt-18,W,20);cx.fillRect(0,rb,W,H-rb);
  // lane markers
  const lh=(rb-rt)/3,doff=(scroll*.45)%80;
  cx.setLineDash([48,28]);cx.lineDashOffset=-doff;
  cx.strokeStyle=c.stripe;cx.lineWidth=2.5;cx.globalAlpha=.55;
  for(let l=1;l<3;l++){const ly=rt+l*lh;cx.beginPath();cx.moveTo(0,ly);cx.lineTo(W,ly);cx.stroke()}
  cx.setLineDash([]);cx.lineDashOffset=0;cx.globalAlpha=1;
  // edges
  cx.strokeStyle='rgba(255,255,255,.7)';cx.lineWidth=2.5;
  cx.beginPath();cx.moveTo(0,rt+1);cx.lineTo(W,rt+1);cx.stroke();
  cx.beginPath();cx.moveTo(0,rb-1);cx.lineTo(W,rb-1);cx.stroke();
}

// ----------------------------------------------------------------
// Game
// ----------------------------------------------------------------
const G={
  canvas:null,cx:null,W:0,H:0,raf:null,
  audio:new Audio2(),sv:null,
  state:'menu',
  // race vars
  player:null,opps:[],traffic:[],parts:[],
  course:null,cidx:0,
  scroll:0,done:false,shake:0,
  lcCool:0,
  lastT:0,

  init(){
    this.canvas=document.getElementById('gameCanvas');
    this.cx=this.canvas.getContext('2d');
    this.sv=load();
    this.resize();
    window.addEventListener('resize',()=>this.resize());
    this.setupInput();
    this.setupTouch();
    this.applySettings();
    this.show('menu');
    // draw static background on canvas
    this.cx.fillStyle='#111';this.cx.fillRect(0,0,this.W,this.H);
  },

  resize(){this.W=this.canvas.width=window.innerWidth;this.H=this.canvas.height=window.innerHeight},

  // Input
  K:{},T:{u:0,d:0,l:0,r:0,pl:0,pr:0},
  setupInput(){
    document.addEventListener('keydown',e=>{
      this.K[e.code]=true;
      if(e.code==='Escape')this.pause();
      if(e.code==='KeyZ')this.punch(-1);
      if(e.code==='KeyX')this.punch(1);
    });
    document.addEventListener('keyup',e=>{this.K[e.code]=false});
  },
  setupTouch(){
    const mob='ontouchstart' in window||navigator.maxTouchPoints>0;
    if(mob)document.getElementById('mc').classList.add('vis');
    const bind=(id,key,cb)=>{
      const el=document.getElementById(id);if(!el)return;
      const on=e=>{e.preventDefault();e.stopPropagation();this.T[key]=1;el.classList.add('act');if(cb)cb()};
      const off=e=>{e.preventDefault();e.stopPropagation();this.T[key]=0;el.classList.remove('act')};
      el.addEventListener('touchstart',on,{passive:false});el.addEventListener('touchend',off,{passive:false});
      el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off);
    };
    bind('du','u');bind('dd','d');bind('dl','l');bind('dr','r');
    bind('pbl','pl',()=>this.punch(-1));
    bind('pbr','pr',()=>this.punch(1));
  },

  applySettings(){
    document.getElementById('s-sound').checked=this.sv.snd!==false;
    document.getElementById('s-haptic').checked=this.sv.hap===true;
    document.getElementById('s-diff').value=this.sv.diff||'medium';
    this.audio.on=this.sv.snd!==false;
  },

  // Screens
  show(name){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    const el=document.getElementById('s-'+name);if(el)el.classList.add('active');
    document.getElementById('hud').classList.remove('vis');
    document.getElementById('mc').classList.remove('vis');
    this.state=name;
    if(name==='menu')document.getElementById('mmoney').textContent=this.sv.money.toLocaleString();
    if(name==='courseSelect'){this.buildCourses();document.getElementById('csmoney').textContent=this.sv.money.toLocaleString()}
    if(name==='shop'){this.buildShop();document.getElementById('shopmoney').textContent=this.sv.money.toLocaleString()}
    if(name==='stats')this.buildStats();
    if(name==='settings')this.applySettings();
  },

  buildCourses(){
    const g=document.getElementById('cgrid');g.innerHTML='';
    COURSES.forEach((c,i)=>{
      const locked=i>this.sv.courses;
      const sel=this.cidx===i;
      const d=document.createElement('div');
      d.className='c-card'+(locked?' locked':'')+(sel?' sel':'');
      d.innerHTML=`<div class="cico">${c.ico}</div><div class="cname">${c.name}</div>
        <div class="creq">${locked?'🔒 Win '+c.req+' races':'💰 $'+c.reward+' reward'}</div>`;
      if(!locked)d.onclick=()=>{this.cidx=i;this.buildCourses()};
      g.appendChild(d);
    });
  },

  goPreRace(){
    this.course=COURSES[this.cidx];
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('s-preRace').classList.add('active');
    this.state='preRace';
    const bk=BIKES.find(b=>b.id===this.sv.equip);
    document.getElementById('pr-course').textContent=`📍 ${this.course.name} — ${this.course.dist}m`;
    document.getElementById('pr-bike').innerHTML=`
      <div style="font-size:16px;font-weight:bold;color:${bk.col}">${bk.name}</div>
      <div style="font-size:11px;color:#666;margin:3px 0">${bk.desc}</div>
      <div style="margin-top:8px">
        <div style="font-size:10px;color:#666">SPEED ${bk.spd}</div>
        <div class="sbar"><div class="sbar-f" style="width:${bk.spd/2.1}%;background:${bk.col}"></div></div>
        <div style="font-size:10px;color:#666;margin-top:4px">ACCEL ${bk.acc}</div>
        <div class="sbar"><div class="sbar-f" style="width:${bk.acc*3}%;background:${bk.col}"></div></div>
        <div style="font-size:10px;color:#666;margin-top:4px">DURABILITY ${bk.dur}</div>
        <div class="sbar"><div class="sbar-f" style="width:${bk.dur/1.5}%;background:${bk.col}"></div></div>
      </div>`;
    const picks=[...RIDERS].sort(()=>Math.random()-.5).slice(0,5);
    document.getElementById('pr-opps').innerHTML=picks.map(r=>`
      <div style="display:flex;align-items:center;gap:8px;margin:4px 0;background:#111;
        border:1px solid #333;border-radius:6px;padding:7px 10px">
        <div style="width:12px;height:12px;border-radius:50%;background:${r.col}"></div>
        <span style="font-weight:bold;color:${r.col};font-size:13px">${r.name}</span>
        <span style="font-size:10px;color:#555;margin-left:auto">${r.p}</span>
      </div>`).join('');
    this._picks=picks;
  },

  beginRace(){
    this.audio.init();
    this.initRace(this._picks||[...RIDERS].slice(0,5));
  },

  initRace(riders){
    const bk=BIKES.find(b=>b.id===this.sv.equip);
    const df=DIFF[this.sv.diff||'medium'];
    const rt=this.H*.52,rb=this.H*.91,lh=(rb-rt)/3;
    const laneY=lane=>rt+lane*lh+lh/2;

    // Player
    this.player={
      x:this.W*.22, lane:1, tLane:1,
      vY:laneY(1), y:laneY(1),
      spd:15, maxSpd:bk.spd, acc:bk.acc,
      hp:bk.dur, maxHp:bk.dur,
      col:bk.col,
      lean:0, crashed:false, crashT:0,
      punchT:0, punchAnim:0, punchDir:0,
      dist:0, alive:true, _fin:false
    };

    // Opponents
    this.opps=riders.map((r,i)=>{
      const ms=bk.spd*df.am*this.course.ais*(0.8+Math.random()*.4);
      return{
        name:r.name, col:r.col, p:r.p,
        x:this.W*.22, lane:Math.floor(Math.random()*3), tLane:Math.floor(Math.random()*3),
        vY:laneY(Math.floor(Math.random()*3)), y:0,
        spd:12, maxSpd:ms, acc:bk.acc*.9,
        hp:100, maxHp:100,
        lean:0, crashed:false, crashT:0,
        punchT:0, punchAnim:0, punchDir:0,
        dist:(Math.random()-.5)*40, alive:true, _fin:false,
        sX:this.W*.22+(i-2)*50
      };
    });

    // Traffic
    this.traffic=[];
    for(let i=0;i<10;i++)this.spawnTraffic(true);

    this.parts=[];
    this.scroll=0;
    this.done=false;
    this.shake=0;
    this.lcCool=0;
    this._finishers=[];

    // Show game UI
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('hud').classList.add('vis');
    if('ontouchstart' in window||navigator.maxTouchPoints>0)
      document.getElementById('mc').classList.add('vis');
    this.state='racing';

    if(this.sv.first){this.sv.first=false;save(this.sv);this.showTut()}

    this.lastT=performance.now();
    cancelAnimationFrame(this.raf);
    this.raf=requestAnimationFrame(t=>this.loop(t));
    this.audio.startEng(15,bk.maxSpd||bk.spd);
  },

  loop(t){
    const dt=Math.min((t-this.lastT)/1000,.05);
    this.lastT=t;
    if(this.state==='racing')this.update(dt);
    this.render();
    this.raf=requestAnimationFrame(t=>this.loop(t));
  },

  update(dt){
    const bk=BIKES.find(b=>b.id===this.sv.equip);
    const df=DIFF[this.sv.diff||'medium'];
    const rt=this.H*.52,rb=this.H*.91,lh=(rb-rt)/3;
    const lY=l=>rt+l*lh+lh/2;
    const p=this.player;

    // Controls
    const accel=this.K['ArrowUp']||this.K['KeyW']||this.T.u;
    const brake=this.K['ArrowDown']||this.K['KeyS']||this.T.d;
    const goL=this.K['ArrowLeft']||this.K['KeyA']||this.T.l;
    const goR=this.K['ArrowRight']||this.K['KeyD']||this.T.r;

    if(!p.crashed&&p.alive){
      if(accel) p.spd=Math.min(p.spd+p.acc*dt*55*.1,p.maxSpd);
      else if(brake) p.spd=Math.max(p.spd-p.acc*dt*55*.18,0);
      else p.spd=Math.max(p.spd-p.acc*dt*55*.025,8);

      if(this.lcCool<=0){
        if(goL){p.tLane=Math.max(0,p.tLane-1);this.lcCool=.28}
        else if(goR){p.tLane=Math.min(2,p.tLane+1);this.lcCool=.28}
      }
    }
    this.lcCool=Math.max(0,this.lcCool-dt);

    // Player crash recovery
    if(p.crashed){
      p.crashT-=dt;p.spd=Math.max(0,p.spd-25*dt);
      if(p.crashT<=0){p.crashed=false;p.hp=Math.min(p.maxHp,p.hp+8)}
    }

    // Move player
    p.dist+=p.spd*dt;
    p.vY+=(lY(p.tLane)-p.vY)*7*dt;
    p.lane=p.tLane;
    const leanTgt=(p.tLane-(p.vY-rt)/lh)*.18;
    p.lean+=(leanTgt-p.lean)*5*dt;
    p.punchT=Math.max(0,p.punchT-dt);
    p.punchAnim=Math.max(0,p.punchAnim-dt);

    this.scroll+=p.spd*dt*2.8;

    // Opponents
    this.opps.forEach(o=>{
      if(!o.alive)return;
      if(o.crashed){
        o.crashT-=dt;o.spd=Math.max(0,o.spd-18*dt);
        if(o.crashT<=0){o.crashed=false;o.hp=Math.min(o.maxHp,o.hp+8)}
      } else {
        // AI speed
        const tSpd=o.maxSpd*(0.72+Math.sin(Date.now()/4000+o.maxSpd*.01)*.28);
        o.spd+=(tSpd-o.spd)*dt*1.2;
        o.spd=Math.max(5,Math.min(o.spd,o.maxSpd));
        // Lane AI
        if(Math.random()<.007){const d=Math.random()<.5?-1:1;o.tLane=Math.max(0,Math.min(2,o.tLane+d))}
        // Avoid traffic
        this.traffic.forEach(t=>{
          const rel=t.sX-o.sX;
          if(rel>0&&rel<140&&t.lane===o.tLane)o.tLane=o.tLane===2?1:o.tLane+1;
        });
        // AI punch player
        if(o.punchT<=0){
          const sx=this.oppSX(o);
          const dx=Math.abs(sx-p.x);
          if(dx<110&&Math.abs(o.lane-p.lane)<=1&&Math.random()<df.apf*55){
            o.punchT=1.6;o.punchAnim=.28;o.punchDir=sx>p.x?-1:1;
            this.hurtPlayer(df.pd,o.name);this.audio.hit();
          }
        }
      }
      o.dist+=o.spd*dt;
      o.vY+=(lY(o.tLane)-o.vY)*7*dt;
      o.lane=o.tLane;
      const lt=(o.tLane-(o.vY-rt)/lh)*.18;
      o.lean+=(lt-o.lean)*5*dt;
      o.punchT=Math.max(0,o.punchT-dt);
      o.punchAnim=Math.max(0,o.punchAnim-dt);
      o.sX=this.oppSX(o);
    });

    // Traffic
    this.traffic.forEach(t=>{t.sX-=(p.spd-t.tspd)*dt*1.8});
    this.traffic=this.traffic.filter(t=>t.sX>-200);
    if(Math.random()<.018)this.spawnTraffic(false);

    // Player vs traffic collision
    if(!p.crashed&&p.alive){
      this.traffic.forEach(t=>{
        if(t.lane===p.tLane&&Math.abs(t.sX-p.x)<75){
          this.hurtPlayer(22,'traffic');t.sX=-300;
          this.shake=.22;
        }
      });
    }

    // Particles
    this.parts.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=.12;pt.life-=dt;pt.a=pt.life/pt.ml});
    this.parts=this.parts.filter(pt=>pt.life>0);

    if(this.shake>0)this.shake-=dt;

    // HUD
    this.updHUD();

    // Finish check
    if(!this.done){
      const D=this.course.dist;
      if(p.dist>=D&&!p._fin){p._fin=true;this._finishers.push('YOU');this.done=true;this.endRace()}
      this.opps.forEach(o=>{
        if(o.alive&&o.dist>=D&&!o._fin){
          o._fin=true;this._finishers.push(o.name);
          if(this._finishers.length>=5&&!this.done){this.done=true;this.endRace()}
        }
      });
    }
  },

  oppSX(o){return this.player.x+(o.dist-this.player.dist)*(this.W/this.course.dist)*2.5},

  hurtPlayer(amt,src){
    const p=this.player;
    if(p.crashed||!p.alive)return;
    p.hp-=amt;this.shake=.25;
    if(this.sv.hap&&navigator.vibrate)navigator.vibrate([28,8,28]);
    if(p.hp<=0){
      p.hp=0;p.alive=false;p.crashed=true;p.crashT=2.2;
      this.audio.crash();this.notify('💀 CRASHED!');
      setTimeout(()=>{if(this.state==='racing')this.endRace()},2200);
    } else {
      p.crashed=true;p.crashT=1;p.hp=Math.max(1,p.hp);
      this.notify(`😵 HIT! (${src})`);
    }
  },

  punch(dir){
    if(this.state!=='racing')return;
    const p=this.player;
    if(p.crashed||p.punchT>0)return;
    this.audio.init();
    p.punchT=.85;p.punchAnim=.28;p.punchDir=dir;
    this.audio.punch();
    if(this.sv.hap&&navigator.vibrate)navigator.vibrate(45);
    let hit=false;
    this.opps.forEach(o=>{
      if(!o.alive||o.crashed)return;
      const sx=this.oppSX(o);
      if(Math.abs(sx-p.x)<125&&Math.abs(o.vY-p.vY)<90&&Math.sign(sx-p.x)===dir){
        o.hp-=28;o.spd=Math.max(o.spd-18,0);
        this.audio.hit();this.spawnHits(sx,o.vY);this.shake=.18;
        this.notify(`💥 HIT ${o.name}!`);hit=true;
        if(o.hp<=0){
          o.alive=false;o.crashed=true;o.spd=0;
          this.audio.crash();this.notify(`☠ KO'd ${o.name}!`);
          this.sv.money+=50;save(this.sv);this.audio.coin();
        } else if(Math.random()<.32){o.crashed=true;o.crashT=1.6;this.audio.crash()}
      }
    });
    if(!hit)this.spawnHits(p.x+dir*80,p.vY,true);
  },

  spawnHits(x,y,miss=false){
    const col=miss?'#888':'#FF6600';
    for(let i=0;i<9;i++)this.parts.push({
      x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*4-1.5,
      life:.5+Math.random()*.3,ml:.8,a:1,col,sz:3+Math.random()*4
    });
  },

  spawnTraffic(spread=false){
    const cols=['#CC3333','#3355CC','#33AA33','#CCCC33','#AA33AA','#888'];
    this.traffic.push({
      sX:spread?this.W*.2+Math.random()*this.W*.9:this.W+80+Math.random()*350,
      lane:Math.floor(Math.random()*3),
      tspd:8+Math.random()*18,
      col:cols[Math.floor(Math.random()*cols.length)]
    });
  },

  updHUD(){
    const p=this.player;
    document.getElementById('hspd').textContent=Math.floor(p.spd);
    document.getElementById('hcash').textContent='$'+this.sv.money.toLocaleString();
    document.getElementById('hdst').textContent=Math.max(0,Math.floor(this.course.dist-p.dist));
    const ahead=this.opps.filter(o=>o.alive&&o.dist>p.dist).length;
    document.getElementById('hpos').textContent=ORD[ahead]||'1st';
    const pct=Math.max(0,p.hp/p.maxHp*100);
    const hb=document.getElementById('hhp');
    hb.style.width=pct+'%';
    hb.style.background=pct>50?'#44FF44':pct>25?'#FFAA00':'#FF4444';
    const bk=BIKES.find(b=>b.id===this.sv.equip);
    this.audio.updEng(p.spd,bk.spd);
  },

  endRace(){
    this.audio.stopEng();
    cancelAnimationFrame(this.raf);
    this.state='results';
    this.sv.races++;
    const p=this.player;
    const ahead=this.opps.filter(o=>o.alive&&o.dist>=p.dist).length;
    const pos=p.alive?Math.min(ahead+1,6):6;
    const won=pos===1;
    const df=DIFF[this.sv.diff||'medium'];
    let earn=0;
    if(won){earn=Math.floor(this.course.reward*df.rm);this.sv.wins++;this.sv.courses=Math.max(this.sv.courses,this.cidx+1);this.audio.win()}
    else{earn=Math.floor(this.course.reward*.08*(6-pos));this.audio.lose()}
    this.sv.money+=earn;this.sv.earned=(this.sv.earned||0)+earn;
    save(this.sv);
    setTimeout(()=>this.showResults(pos,earn,won),600);
  },

  showResults(pos,earn,won){
    document.getElementById('hud').classList.remove('vis');
    document.getElementById('mc').classList.remove('vis');
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    document.getElementById('s-results').classList.add('active');
    const rp=document.getElementById('rpos');
    rp.textContent=ORD[pos-1]||pos+'th';
    rp.style.color=won?'#FFD700':pos<=3?'#CC8800':'#FF4444';
    document.getElementById('rtitle').textContent=
      won?'🏆 VICTORY!':!this.player.alive?'💀 WIPED OUT!':pos<=3?'👊 PODIUM FINISH':'😤 BETTER LUCK';
    const kos=this.opps.filter(o=>!o.alive).length;
    document.getElementById('rdetails').innerHTML=`
      <div style="display:flex;justify-content:space-between;margin:7px 0">
        <span style="color:#666">Course</span><span style="color:#FF6600">${this.course.name}</span></div>
      <div style="display:flex;justify-content:space-between;margin:7px 0">
        <span style="color:#666">Position</span><span>${ORD[pos-1]}</span></div>
      <div style="display:flex;justify-content:space-between;margin:7px 0">
        <span style="color:#666">Top Speed</span><span>${Math.floor(this.player.maxSpd)} mph</span></div>
      <div style="display:flex;justify-content:space-between;margin:7px 0">
        <span style="color:#666">KO's</span><span style="color:#FF4444">${kos}</span></div>
      <hr style="border-color:#333;margin:10px 0">
      <div style="display:flex;justify-content:space-between;margin:7px 0;font-size:20px">
        <span style="color:#FFD700">EARNINGS</span><span style="color:#FFD700">+$${earn}</span></div>
      <div style="display:flex;justify-content:space-between;margin:5px 0">
        <span style="color:#666">Total</span><span>$${this.sv.money.toLocaleString()}</span></div>`;
    const nb=document.getElementById('btn-next');
    if(won&&this.cidx+1<COURSES.length){nb.style.display='';nb.onclick=()=>{this.cidx++;this.goPreRace()}}
    else nb.style.display='none';
  },

  nextCourse(){this.show('courseSelect')},

  buildShop(){
    const g=document.getElementById('bgrid');g.innerHTML='';
    BIKES.forEach(b=>{
      const owned=this.sv.bikes.includes(b.id);
      const equip=this.sv.equip===b.id;
      const afford=this.sv.money>=b.cost;
      const d=document.createElement('div');
      d.className='b-card'+(equip?' equip':owned?' owned':'');
      d.innerHTML=`
        <div style="font-size:14px;font-weight:bold;color:${b.col}">${b.name}</div>
        <div style="font-size:11px;color:#555;margin:3px 0">${b.desc}</div>
        <div style="margin:8px 0">
          <div style="font-size:9px;color:#666">SPD ${b.spd}</div>
          <div class="sbar"><div class="sbar-f" style="width:${b.spd/2.1}%;background:${b.col}"></div></div>
          <div style="font-size:9px;color:#666;margin-top:3px">ACC ${b.acc}</div>
          <div class="sbar"><div class="sbar-f" style="width:${b.acc*3}%;background:${b.col}"></div></div>
          <div style="font-size:9px;color:#666;margin-top:3px">DUR ${b.dur}</div>
          <div class="sbar"><div class="sbar-f" style="width:${b.dur/1.5}%;background:${b.col}"></div></div>
        </div>
        <div style="font-size:13px;color:${owned?'#44FF44':'#FFD700'};margin:6px 0">
          ${owned?(equip?'✓ EQUIPPED':'OWNED'):'$'+b.cost.toLocaleString()}</div>
        ${!owned?`<button class="btn${!afford?' dim':''}" style="width:100%;padding:7px;font-size:12px;margin-top:0"
          onclick="G.buy('${b.id}')">${afford?'BUY':'NEED $'+(b.cost-G.sv.money)}</button>`
          :(!equip?`<button class="btn sec" style="width:100%;padding:7px;font-size:12px"
            onclick="G.equip('${b.id}')">EQUIP</button>`:'')}`;
      g.appendChild(d);
    });
  },

  buy(id){
    const b=BIKES.find(b=>b.id===id);
    if(!b||this.sv.money<b.cost)return;
    this.sv.money-=b.cost;this.sv.bikes.push(id);this.sv.equip=id;save(this.sv);
    this.buildShop();document.getElementById('shopmoney').textContent=this.sv.money.toLocaleString();
  },

  equip(id){this.sv.equip=id;save(this.sv);this.buildShop()},

  buildStats(){
    document.getElementById('statsbox').innerHTML=`
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
        <div style="text-align:center;padding:10px;background:#1a1a1a;border-radius:8px">
          <div style="font-size:26px;color:#FF6600">${this.sv.wins||0}</div>
          <div style="font-size:10px;color:#555">WINS</div></div>
        <div style="text-align:center;padding:10px;background:#1a1a1a;border-radius:8px">
          <div style="font-size:26px;color:#4488FF">${this.sv.races||0}</div>
          <div style="font-size:10px;color:#555">RACES</div></div>
        <div style="text-align:center;padding:10px;background:#1a1a1a;border-radius:8px">
          <div style="font-size:26px;color:#FFD700">$${(this.sv.earned||0).toLocaleString()}</div>
          <div style="font-size:10px;color:#555">EARNED</div></div>
        <div style="text-align:center;padding:10px;background:#1a1a1a;border-radius:8px">
          <div style="font-size:26px;color:#44FF44">${this.sv.bikes.length}</div>
          <div style="font-size:10px;color:#555">BIKES</div></div>
      </div>
      <div style="font-size:11px;color:#555;margin-bottom:8px">COURSES UNLOCKED</div>
      ${COURSES.map((c,i)=>`<div style="margin:5px 0;display:flex;align-items:center;gap:8px">
        <span>${i<=this.sv.courses?'✅':'🔒'}</span>
        <span style="color:${i<=this.sv.courses?'#ccc':'#444'};font-size:13px">${c.ico} ${c.name}</span>
      </div>`).join('')}`;
  },

  pause(){
    if(this.state==='racing'){
      this.state='paused';document.getElementById('pauseov').classList.add('act');this.audio.stopEng();
    } else if(this.state==='paused'){
      this.state='racing';document.getElementById('pauseov').classList.remove('act');
      this.lastT=performance.now();
      const bk=BIKES.find(b=>b.id===this.sv.equip);this.audio.startEng(this.player.spd,bk.spd);
    }
  },

  restartRace(){
    document.getElementById('pauseov').classList.remove('act');
    this.audio.stopEng();
    cancelAnimationFrame(this.raf);
    this.goPreRace();
  },

  quitMenu(){
    document.getElementById('pauseov').classList.remove('act');
    this.audio.stopEng();cancelAnimationFrame(this.raf);this.show('menu');
  },

  setSnd(v){this.sv.snd=v;this.audio.on=v;save(this.sv)},
  setHap(v){this.sv.hap=v;save(this.sv)},
  setDiff(v){this.sv.diff=v;save(this.sv)},

  resetSave(){localStorage.removeItem(SK);this.sv=defSave();this.show('menu')},

  notify(msg){
    const el=document.createElement('div');el.className='notif';el.textContent=msg;
    document.getElementById('notifs').appendChild(el);
    setTimeout(()=>el.remove(),2200);
  },

  showTut(){
    const tut=document.getElementById('tut');
    const msgs=['↑ Accelerate  ↓ Brake  ← → Change Lane','Z = Punch Left  X = Punch Right','Race to the finish! Hit opponents to slow them!'];
    let i=0;
    const next=()=>{
      if(i>=msgs.length){tut.style.opacity='0';return}
      tut.textContent=msgs[i++];tut.style.opacity='1';
      setTimeout(()=>{tut.style.opacity='0';setTimeout(next,700)},2600);
    };
    setTimeout(next,800);
  },

  // Render
  render(){
    const cx=this.cx,W=this.W,H=this.H;
    cx.save();
    if(this.shake>0){const s=this.shake*10;cx.translate((Math.random()-.5)*s,(Math.random()-.5)*s)}

    if(!this.course||this.state==='menu'||this.state==='courseSelect'||
       this.state==='preRace'||this.state==='results'||this.state==='shop'||
       this.state==='stats'||this.state==='settings'){
      cx.fillStyle='#080808';cx.fillRect(0,0,W,H);cx.restore();return;
    }

    const c=this.course;
    const rt=H*.52,rb=H*.91,lh=(rb-rt)/3;
    const lY=l=>rt+l*lh+lh/2;

    drawBg(cx,W,H,c,this.scroll);

    // Finish line
    const distLeft=c.dist-this.player.dist;
    if(distLeft<600){
      const fx=this.player.x+distLeft*(W/c.dist)*2.5;
      if(fx<W+150){
        for(let i=0;i<10;i++){
          cx.fillStyle=(i%2)?'#FFF':'#000';
          cx.fillRect(fx+i*14,rt,14,(rb-rt)/2);
          cx.fillStyle=(i%2)?'#000':'#FFF';
          cx.fillRect(fx+i*14,rt+(rb-rt)/2,14,(rb-rt)/2);
        }
        cx.fillStyle='#FF0000';cx.fillRect(fx+70,rt-55,5,57);
        cx.fillStyle='#FF0000';cx.fillRect(fx+70,rt-55,36,22);
        cx.fillStyle='#FFD700';cx.font='bold 11px monospace';cx.textAlign='left';
        cx.fillText('FINISH',fx+72,rt-39);
      }
    }

    // Distance marker
    if(distLeft>600){
      cx.fillStyle='rgba(0,0,0,.55)';cx.fillRect(W-120,H*.52-28,115,22);
      cx.fillStyle='#FF6600';cx.font='bold 13px monospace';cx.textAlign='right';
      cx.fillText(Math.floor(distLeft)+'m to finish',W-10,H*.52-11);
    }

    // Scale helper based on lane Y (perspective)
    const sc=y=>0.65+(y-rt)/(rb-rt)*.4;

    // Traffic
    this.traffic.forEach(t=>{
      const ty=lY(t.lane);drawCar(cx,t.sX,ty,t.col,sc(ty)*.85);
    });

    // Opponents
    this.opps.forEach(o=>{
      o.sX=this.oppSX(o);
      if(o.sX<-180||o.sX>W+180)return;
      const s=sc(o.vY)*.88;
      drawBike(cx,o.sX,o.vY,o.col,o.lean,o.crashed,s);
      if(o.sX>20&&o.sX<W-20){
        // HP bar
        const hw=48,hpct=Math.max(0,o.hp/o.maxHp);
        cx.fillStyle='#222';cx.fillRect(o.sX-hw/2,o.vY-58,hw,5);
        cx.fillStyle=hpct>.5?'#44FF44':hpct>.25?'#FFAA00':'#FF4444';
        cx.fillRect(o.sX-hw/2,o.vY-58,hw*hpct,5);
        // Name
        cx.fillStyle='rgba(0,0,0,.65)';cx.fillRect(o.sX-24,o.vY-52,48,14);
        cx.fillStyle=o.col;cx.font='bold 10px Courier New';cx.textAlign='center';
        cx.fillText(o.name,o.sX,o.vY-41);
      }
      if(o.punchAnim>0){
        cx.font='18px Arial';cx.textAlign='center';
        cx.fillText('👊',o.sX+o.punchDir*55,o.vY-18);
      }
    });

    // Player
    const p=this.player;
    drawBike(cx,p.x,p.vY,p.col,p.lean,p.crashed,1);

    // Speed lines
    if(p.spd>55&&!p.crashed){
      const a=(p.spd-55)/p.maxSpd*.35;
      cx.strokeStyle=`rgba(255,255,255,${a})`;cx.lineWidth=1;
      for(let i=0;i<10;i++){
        const ly=p.vY-24+i*7;const lx=p.x-55-Math.random()*25;
        cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(lx-35-Math.random()*55,ly);cx.stroke();
      }
    }

    if(p.punchAnim>0){
      cx.font='24px Arial';cx.textAlign='center';
      cx.fillText('👊',p.x+p.punchDir*78,p.vY-28);
    }

    // Particles
    this.parts.forEach(pt=>{
      cx.globalAlpha=pt.a;cx.fillStyle=pt.col;
      cx.fillRect(pt.x-pt.sz/2,pt.y-pt.sz/2,pt.sz,pt.sz);
    });
    cx.globalAlpha=1;

    // Minimap
    this.renderMap(cx,W,H);

    cx.restore();
  },

  renderMap(cx,W,H){
    const mx=W-135,my=H-85,mw=115,mh=55;
    cx.fillStyle='rgba(0,0,0,.72)';cx.fillRect(mx-4,my-4,mw+8,mh+8);
    cx.strokeStyle='#333';cx.lineWidth=1;cx.strokeRect(mx-4,my-4,mw+8,mh+8);
    cx.fillStyle='#444';cx.fillRect(mx,my+mh/2-2,mw,5);
    cx.fillStyle='#FFF';cx.fillRect(mx+mw-3,my+2,3,mh-4);
    cx.font='9px monospace';cx.fillStyle='#555';cx.textAlign='left';cx.fillText('MAP',mx,my-7);
    this.opps.forEach(o=>{
      if(!o.alive)return;
      const ox=mx+(o.dist/this.course.dist)*mw;
      const oy=my+(o.lane/3)*mh+mh/6;
      cx.fillStyle=o.col;cx.fillRect(ox-3,oy-3,6,6);
    });
    const p=this.player;
    const px=mx+(p.dist/this.course.dist)*mw;
    const py=my+(p.lane/3)*mh+mh/6;
    cx.fillStyle='#FFF';cx.fillRect(px-4,py-4,8,8);
    cx.strokeStyle='#FF6600';cx.lineWidth=2;cx.strokeRect(px-4,py-4,8,8);
  }
};

window.addEventListener('DOMContentLoaded',()=>G.init());
</script>
</body>
</html>
